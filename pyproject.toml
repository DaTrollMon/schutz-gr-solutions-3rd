[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schutz-gr"
version = "0.1.0"
description = "Worked solutions to Schutz, A First Course in General Relativity (3rd ed.), plus supporting code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "sympy",
    "matplotlib",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
    "pytest",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/schutz_gr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
